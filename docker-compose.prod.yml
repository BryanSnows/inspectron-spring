version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: inspectron-db-prod
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=pass123
      - POSTGRES_DB=inspectron
      - ENVIRONMENT=prod
      - APP_DB_NAME=inspectron
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./script/setup-db.sh:/docker-entrypoint-initdb.d/10-setup-db.sh:ro
    networks:
      - internal
    labels:
      - 'traefik.enable=false'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: inspectron-app-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/inspectron
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-prodpass123}
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_JPA_SHOW_SQL=false
    ports:
      - "8082:8080"
    networks:
      - traefik-proxy
      - internal
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik-proxy'

      # HTTPS Router
      - 'traefik.http.routers.inspectron-api-prod.rule=Host(`inspectron-api.indt.org.br`)'
      - 'traefik.http.routers.inspectron-api-prod.entrypoints=websecure'
      - 'traefik.http.routers.inspectron-api-prod.tls=true'
      - 'traefik.http.routers.inspectron-api-prod.tls.certresolver=myresolver'
      - 'traefik.http.routers.inspectron-api-prod.middlewares=secure-headers'
      - 'traefik.http.routers.inspectron-api-prod.service=inspectron-api-prod'

      # HTTP -> redirect or middleware (optional)
      - 'traefik.http.routers.inspectron-api-prod-http.rule=Host(`inspectron-api.indt.org.br`)'
      - 'traefik.http.routers.inspectron-api-prod-http.entrypoints=web'
      - 'traefik.http.routers.inspectron-api-prod-http.service=inspectron-api-prod'

      # Service configuration
      - 'traefik.http.services.inspectron-api-prod.loadbalancer.server.port=8080'

volumes:
  pgdata_prod:

networks:
  internal:
    name: inspectron-prod_internal_network
    driver: bridge
    internal: true

  traefik-proxy:
    external: true
