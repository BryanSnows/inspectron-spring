version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: inspectron-db-dev
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=pass123
      - POSTGRES_DB=inspectron
      - ENVIRONMENT=dev
      - APP_DB_NAME=inspectron
    ports:
      - "5449:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./script/setup-db.sh:/docker-entrypoint-initdb.d/10-setup-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inspectron-app-dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/inspectron
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=pass123
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "8080:8080"

volumes:
  pgdata_dev: