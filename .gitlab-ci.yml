# GitLab CI/CD Pipeline para projeto Maven Spring Boot

stages:
  - build
  - test
  - code-quality
  - deploy

variables:
  # Maven / Java
  MAVEN_CLI_OPTS: "-B"
  MAVEN_OPTS: "-Xmx1g"
  # Diretório do repositório Maven cacheado
  MAVEN_CACHE_DIR: "$CI_PROJECT_DIR/.m2/repository"

# Padrões para todos os jobs
default:
  tags:
    - docker
    - maven
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure

# Cache para acelerar builds
cache:
  key:
    files:
      - pom.xml
      - .mvn/wrapper/maven-wrapper.properties
  paths:
    - .m2/repository
  policy: pull-push

# ================================
# BUILD STAGE
# ================================

build:
  stage: build
  image: maven:3.9.4-eclipse-temurin-21
  tags:
    - maven
    - docker
  before_script:
    # Garantir permissões do cache Maven
    - mkdir -p "$CI_PROJECT_DIR/.m2" && ls -la "$CI_PROJECT_DIR"
  script:
    - mvn $MAVEN_CLI_OPTS -DskipTests package
  artifacts:
    paths:
      - target/*.jar
      - target/
    expire_in: 2 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "homolog"
    - if: $CI_COMMIT_BRANCH == "main"

# ================================
# TEST STAGE
# ================================

unit-tests:
  stage: test
  image: maven:3.9.4-eclipse-temurin-21
  tags:
    - maven
    - test
  needs:
    - build
  dependencies:
    - build
  script:
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/*.xml
    paths:
      - target/surefire-reports/
      - target/*.jar
    expire_in: 1 day
  coverage: '/All tests.*?\s([0-9]{1,3}%)/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "homolog"
    - if: $CI_COMMIT_BRANCH == "main"

# ================================
# CODE QUALITY
# ================================
# Executa verificações de qualidade. Como projetos Maven variam em plugins,
# este job é tolerante a falhas (allow_failure) para não quebrar pipelines
# caso algum plugin não esteja presente.
code-quality:
  stage: code-quality
  image: maven:3.9.4-eclipse-temurin-21
  tags:
    - maven
  needs:
    - unit-tests
  script:
    # roda verificações rápidas; se você tiver Checkstyle/SpotBugs configurado
    # eles serão executados aqui. Mantemos allow_failure para segurança.
    - mvn $MAVEN_CLI_OPTS -DskipTests verify
  allow_failure: true
  artifacts:
    paths:
      - target/*-reports/
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "homolog"
    - if: $CI_COMMIT_BRANCH == "main"

# ================================
# DEPLOY
# ================================

deploy-hmg:
  stage: deploy
  image: docker:26.1.0
  tags:
    - deploy
  services:
    - name: docker:26.1.0-dind
      alias: docker
  needs: ['unit-tests', 'build']
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2
  script:
    - docker --version
    - docker-compose -f docker-compose.homolog.yml -p inspectron-backend-hmg up -d --build
  rules:
    - if: $CI_COMMIT_BRANCH == "homolog"

deploy-production:
  stage: deploy
  image: docker:26.1.0
  tags:
    - deploy
  services:
    - name: docker:26.1.0-dind
      alias: docker
  needs: ['unit-tests', 'build']
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2
  script:
    - docker --version
    - docker-compose -f docker-compose.prod.yml -p inspectron-backend-prod up -d --build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

